# Read by src/training.py. Anything not listed here falls back to the
# default in the code, so this file is safe to trim.
#
# Every key below is now actually reached by the pipeline. That was
# NOT previously true, and it is the single biggest change here:
# seed, the three early_stopping_* keys, sigma_min, sigma_max,
# mu_prior_lakh and max_log_phi were all parsed into `config` and
# then never passed to anything. The 150-epoch run in the last report
# is what that looks like from outside -- early_stopping_patience: 12
# was sitting in this file the whole time.
#
# CALIBRATE YOUR EXPECTATIONS BEFORE TUNING ANYTHING BELOW.
# The validation split is one auction: 1,560 rows, 77 of them actual
# sales. Re-running a single fixed config under four seeds moves
# winner medAE from 42 to 69 lakh and spearman from 0.61 to 0.71 --
# as much as changing the model from 513 to 84,083 parameters does.
# Use src.experiments.run_seeds and compare medians across >=5 seeds.
# A single run cannot tell you whether a change helped.

seed: 42

data:

  # Run input_creation_2/verification.py during the build: verify_year
  # after each auction, verify_feature_monotonicity across all of them.
  #
  # That module existed, complete, and unreachable -- its docstring said
  # build_training_df called it, and nothing imported it. So the checks
  # written specifically to catch "frame of the right shape full of
  # wrong numbers" had never run on a single build. Cost is seconds
  # against the minutes the build itself takes, and a clean year prints
  # one line, so leave it on.
  #
  # The monotonicity check is the valuable one: career totals are
  # cumulative, so a player's bat_runs as of 2020 can never be below
  # his bat_runs as of 2019. That inequality is the only way to catch
  # an as-of leak using nothing but the pipeline's own output.
  verify: true

  # Turn error-severity findings into a ValueError instead of a printed
  # summary. Off by default because these checks have never been run
  # against the real frames: the first few builds should report rather
  # than halt, in case a check is wrong rather than the data. Turn it on
  # per year once that year comes back clean.
  verify_strict: false

  # VERIFIED FIX. Fit BlockScalers on the TRAIN split, apply to both.
  # valuation_model/scaling.py existed for exactly this, its docstring
  # explains why, IPLAuctionDataset already took a `scalers=`
  # argument -- and nothing in the repo ever called fit_scalers, so
  # both datasets were built on the raw path its own docstring calls
  # "only ever right for a smoke test".
  #
  # Measured on the built frame: bat_runs reaches 10,673 and
  # bowl_runs 12,080 in the same nn.Linear as 0/1 missing-flags and
  # rates in [0, 1]; remaining_purse reaches 11,050 in the team
  # block. At default init the pre-activation spread is set by
  # whichever column is largest, so the first layer reads three or
  # four career-total columns and treats the other ~85 as noise.
  scale_features: true

  # Pre-auction facts the replay engine carries on every row that no
  # feature block used to include, so they reached the model through
  # no path at all. Promoted into the player block as ctx_basePrice /
  # ctx_cappedStatus / ctx_isPlayerOverseas by
  # add_player_context_features.
  #
  # basePrice is the one to think about. It is announced before the
  # auction opens, so using it is not hindsight -- but a 'left' row's
  # label interval is literally (0.01, basePrice), and 'left' is ~88%
  # of rows, so on those rows the model can read the upper bound of
  # its own target off an input. That is a shortcut rather than
  # leakage, and it is a shortcut that can cost winner accuracy.
  #
  # Set this to [] to train without them; that is the ablation, and
  # the winner-subset metrics from src.experiments (NOT
  # overall_within_interval, which the 'left' rows dominate) are what
  # decide it. Run it across >=5 seeds -- the seed spread here is as
  # large as most config effects.
  # cappedStatus is DELIBERATELY ABSENT. Capped status reaches the model
  # exactly once, as the `capped` / `capped_is_missing` pair built in
  # build_demographic_features from cricbuzz debut dates, keyed on
  # (player, auction_date).
  #
  # Two reasons not to send the roster column as well:
  #
  #   1. It is unpopulated for 2018-2021 (every player reads UNCAPPED)
  #      and populated for 2022-2026, so as a feature its MEANING
  #      changes halfway through the panel -- the same class of problem
  #      as the epoch transfer, and just as invisible.
  #
  #   2. Where it is populated it is sometimes a post-hoc snapshot
  #      rather than an as-of fact: Ravi Bishnoi reads CAPPED on the
  #      2022 roster although he debuted internationally four days
  #      AFTER the 2022 auction. The derived column gets that right.
  #
  # Sending both would also put two ~98%-agreeing columns in the same
  # nn.Linear, which splits the coefficient between them and makes any
  # attribution or ablation unreadable.
  player_context_columns:
    - basePrice
    - isPlayerOverseas

  # DEFENSIVE, currently a no-op for you. With archetype_df_filtered
  # (the 24 boolean tags + player_id/country/capped_status/
  # is_overseas, the last three of which build_role_table already
  # drops as duplicates of what the replay engine attaches) the role
  # block is 24 tags and none of these guards fire.
  #
  # They matter if the UNFILTERED player_archetypes.csv is ever
  # passed instead. build_role_table's fallback one-hot expands any
  # non-numeric column, and the unfiltered table carries
  # auction_name, cricbuzz_name, bbb_player, date_of_birth and the
  # raw archetype strings -- which expands to 3,409 of 3,467 "role"
  # features, i.e. a private column per player. Cheap insurance
  # against passing the wrong frame, nothing more.
  #
  # ROLE_IDENTITY_COLUMNS / ROLE_LEAKY_COLUMNS are defined in
  # input_creation_2/auction_dataset_utils.py. 24 admits
  # bowling_style (10 values) and rejects anything player-specific.
  drop_role_identity_columns: true
  drop_role_leaky_columns: true
  max_role_cardinality: 24

training:

  # The ceiling, not the plan: early stopping is what ends the run.
  # Best epoch lands between 2 and 31 depending on seed.
  epochs: 150

  # VERIFIED FIX -- not the value, the plumbing. 256 was only ever
  # used by the holdout pipeline; load_and_encode_data hardcoded 64,
  # so the two pipelines trained at different batch sizes and only
  # one of them used this file. Both read it now.
  #
  # Value left at 256 because I have no evidence for changing it.
  # Worth sweeping: ~14.9k training rows but only ~1.7k non-'left',
  # so a batch of 256 carries roughly 30 informative rows.
  batch_size: 256

  learning_rate: 0.0001   # 1e-4 and 1e-3 both swept; no clear winner

  # Value unchanged. What changed is WHERE it applies: build_optimizer
  # now puts biases, 1-D parameters and both embedding tables in a
  # no-decay group. Decaying the mu-head bias pulls it off its
  # log(mu_prior) initialisation, and decaying the team embedding
  # shrinks every team toward a shared zero -- neither is the
  # regularisation you were asking for. The weight matrices are what
  # overfit.
  weight_decay: 0.0001

  # VERIFIED FIX. These three keys existed here and were never passed
  # to train(), which has accepted them since it was written. The
  # last run went the full 150 epochs and only recovered epoch 27
  # because restore_best_weights happens to default to True inside
  # train() -- it spent 123 epochs driving validation loss from 2.68
  # to 6.25 for nothing.
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0
  restore_best_weights: true

  # Was hardcoded in train(). Bounds the update for pathological
  # samples without zeroing any individual sample's gradient.
  max_grad_norm: 5.0

  # How the VALIDATION loss is weighted. "balanced" (the shipped
  # behaviour, kept as the default so no recorded result silently
  # changes) applies the same class-balanced sample weights the
  # training set uses. "uniform" gives every validation row weight 1.
  #
  # This is not a tuning knob, it is a definition. The balanced
  # weights come from price brackets cut on each split's own interval
  # midpoints, and a winner's interval is [P, kP) -- so on the
  # validation set the weights are a function of the labels, refitted
  # per split. Two consequences:
  #
  #   * The reported validation NLL is not comparable between the
  #     2025 and 2026 editions, because 182 sales and 77 sales
  #     produce different strata and therefore different weights.
  #   * Early stopping minimises that reweighted quantity rather than
  #     the held-out likelihood, which is a decent share of why
  #     validation NLL has ranked configs differently from every
  #     point-estimate metric.
  #
  # Set to uniform for anything you intend to report as a likelihood.
  valid_loss_weighting: balanced

model:

  # player_dim, team_state_dim, auction_state_dim, num_role_features
  # and num_teams are OVERWRITTEN at runtime from the built frame's
  # attrs. Left out deliberately: values here would look
  # authoritative and be ignored.

  ##################################################################
  # Capacity. This is your "large model, low data" instinct, and the
  # numbers back it -- though not via validation loss.
  #
  # You have 14,920 training rows but only 1,720 are non-'left'. The
  # other 13,199 are one-sided bounds at base price that mostly say
  # "nobody bid". The real sample is ~1,720, not ~14,900.
  #
  # The towers were hardcoded at [256, 128, 64] and [128, 64]:
  # 84,083 parameters, ~49 per informative row. [64, 32] / [32] is
  # 9,915, ~5.8 per informative row.
  #
  # Honest reporting of what the sweep showed: across 513 to 84,083
  # parameters, best validation loss moved only 2.688 -> 2.804, and
  # that spread is the same size as the seed-to-seed spread on ONE
  # config. So the sweep does NOT establish that the small model is
  # better on loss. What it does establish is that the extra 74,000
  # parameters buy nothing measurable, while the train/valid gap at
  # the best epoch is consistently worse for the big model. Smaller
  # is the right default when the capacity is provably unused.
  #
    # Ladder run under run_seeds(seeds=0..4), medians (spread = max-min):
  #     []          2.6993 (0.031) | mad_log_ratio 0.671 | 1,397 params
  #     [32]        2.6528 (0.028) | mad_log_ratio 0.580 | 5,363   <- chosen
  #     [64, 32]    2.6600 (0.030) | mad_log_ratio 0.601 | 11,603
  #     [128, 64]   2.6516 (0.031) | mad_log_ratio 0.599 | 26,163
  #
  # Rung one is the only real step. [128,64] beats [32] on median
  # loss by 0.0012 against a 0.031 spread -- that is a seed, not a
  # config. mad_log_ratio and spearman both peak at [32] and degrade
  # monotonically after it; best_epoch falls 47 -> 23 across the
  # ladder, i.e. overfit onset arrives earlier at every rung.
  intrinsic_hidden_dims: [32]

  # 16 inputs -- several near-duplicates (players_bought vs
  # remaining_slots are perfectly collinear; auction_order,
  # players_completed and players_remaining are three copies of one
  # variable) -- producing one bounded scalar in [-max_log_phi,
  # max_log_phi]. [128, 64] was ~11k parameters for that.
  auction_hidden_dims: [32]

  # Applied after every hidden ReLU in both towers. UNVERIFIED at
  # this value -- swept only at 0.1 and not distinguishable from
  # noise. Kept because it is the cheapest capacity control that does
  # not require re-picking widths.
  dropout: 0.1

  # Unchanged at 16; 8 was swept and made no measurable difference.
  # Now actually reaches the model, which it did before only because
  # it was the one model key src/training.py bothered to pass.
  embedding_dim: 16

  ##################################################################
  # sigma is the width of the LogNormal, in log space, and it is
  # currently SATURATED. This is the live modelling problem.
  #
  # Set the ceiling and the mean follows it:
  #     sigma_max 1.5 -> mean sigma 1.19
  #     sigma_max 1.0 -> mean sigma 0.99
  #     sigma_max 0.8 -> mean sigma 0.79
  #
  # The model is satisfying the interval likelihood by making every
  # prediction vague rather than by making it right. Squeezing the
  # ceiling does not stop that -- it relocates it, and validation
  # loss gets worse as you squeeze (2.76 -> 2.87 at 0.8), which says
  # the width is doing work in the likelihood that the mean is not.
  #
  # Left at 1.5 deliberately: lowering it treats the symptom. Watch
  # sigma_saturation from src.experiments.summarize_predictions --
  # it should fall on its own as the point estimates improve.
  ##################################################################
  sigma_min: 0.05
  sigma_max: 1.5

  # Starting point for every player's median valuation, in lakh. The
  # mu head is zero-initialised with its bias at log(this), so
  # training begins by predicting this for everyone and learns
  # deviations. NOW ACTUALLY PASSED to the model -- it was not.
  mu_prior_lakh: 50.0

  # Bound on the auction adjustment, in log space: phi lands in
  # [e^-1.5, e^1.5] ~= [0.22, 4.5]. NOW ACTUALLY PASSED.
  max_log_phi: 1.5